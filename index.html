<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPSA Run Tracker (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --damson: #12324A; --damson-800: #2C5170; --damson-600: #5E7D96; --damson-400: #9DB2C2;
  --damson-200: #CFDCE5; --damson-100: #E6EEF3; --damson-50: #F3F7FA;
  --near-black: #1a1a1a; --linen: #F4F6F7; --sand: #EAF1F6; --soft-white: #FFFFFF;
  --stormy-teal: #1F6FB2; --system-red: #C40B0E; --system-green: #4DB748; --system-yellow: #F2A72A;
  --border-default: #E2E8ED; --border-strong: #C3CED7; --border-muted: #EEF2F5;
  --field: #FFFFFF; --on-accent: #FFFFFF;
  --ok-bg: #DBF1DA; --ok-fg: #2d6b29; --bad-bg: #F3CECF; --bad-fg: #C40B0E; --bad-text: #7a0709;
  --warn-bg: #FCEDD4; --warn-fg: #8a5d0c; --warn-text: #6b4a0b; --shadow: rgba(18,50,74,.08);
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --damson: #CFE3F2; --damson-800: #B5CDE0; --damson-600: #8FAAC0; --damson-400: #64809A; --damson-200: #34495C; --damson-100: #2A3B4B; --damson-50: #213040;
    --near-black: #E9EEF2; --linen: #0F1820; --sand: #1E2C38; --soft-white: #17222C; --stormy-teal: #6AAEE6; --system-red: #FF8A8C;
    --border-default: #2C3B48; --border-strong: #4A5D6E; --border-muted: #22303C;
    --field: #1D2A35; --on-accent: #0F1820;
    --ok-bg: #1F3A24; --ok-fg: #9FDC9B; --bad-bg: #4A1A1E; --bad-fg: #FF9C9E; --bad-text: #FFC2C3;
    --warn-bg: #43341A; --warn-fg: #F2C97A; --warn-text: #F5D9A2; --shadow: rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --damson: #CFE3F2; --damson-800: #B5CDE0; --damson-600: #8FAAC0; --damson-400: #64809A; --damson-200: #34495C; --damson-100: #2A3B4B; --damson-50: #213040;
  --near-black: #E9EEF2; --linen: #0F1820; --sand: #1E2C38; --soft-white: #17222C; --stormy-teal: #6AAEE6; --system-red: #FF8A8C;
  --border-default: #2C3B48; --border-strong: #4A5D6E; --border-muted: #22303C;
  --field: #1D2A35; --on-accent: #0F1820;
  --ok-bg: #1F3A24; --ok-fg: #9FDC9B; --bad-bg: #4A1A1E; --bad-fg: #FF9C9E; --bad-text: #FFC2C3;
  --warn-bg: #43341A; --warn-fg: #F2C97A; --warn-text: #F5D9A2; --shadow: rgba(0,0,0,.35);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body.readonly [data-action="new"], body.readonly [data-action="edit"], body.readonly [data-action="delete"],
body.readonly .add-row, body.readonly [data-action="mark-sent"], body.readonly [data-action="tpl-new"],
body.readonly [data-action="tpl-up"], body.readonly [data-action="tpl-down"],
body.readonly [data-action="tpl-edit"], body.readonly [data-action="tpl-delete"], body.readonly [data-action="restore"],
body.readonly [data-action="note"], body.readonly [data-action="remove-task"],
body.readonly [data-action="font-up"], body.readonly [data-action="font-down"], body.readonly [data-action="make-draft"] { display: none !important; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--damson-800); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--stormy-teal); }
.who { font-weight: 500; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--linen); color: var(--near-black); font: 15px/1.5 var(--sans); min-height: 100%; }
h1 { font-family: var(--serif); font-weight: 400; color: var(--damson); font-size: 30px; line-height: 1.25; margin: 0; }
h2, h3 { font-family: var(--sans); color: var(--damson); font-weight: 600; margin: 0; }
h2 { font-size: 19px; }
a { color: var(--damson); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--damson); outline-offset: 2px; }

.wrap { max-width: 1160px; margin: 0 auto; padding: 32px 32px 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 8px; padding: 9px 16px; font-weight: 500; cursor: pointer; border: 1px solid var(--damson); background: transparent; color: var(--damson); transition: background .15s; }
.btn:hover { background: var(--damson-50); }
.btn-primary { background: var(--damson); color: var(--soft-white); }
.btn-primary:hover { background: var(--damson-800); }
.btn-quiet { border-color: transparent; padding: 6px 10px; }
.btn-danger { border-color: var(--system-red); color: var(--system-red); }
.btn-danger:hover { background: var(--bad-bg); }
.card { background: var(--soft-white); border-radius: 12px; box-shadow: 0 1px 3px var(--shadow); padding: 24px; }
.muted { color: var(--damson-600); }
.small { font-size: 13px; }
.banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; }

/* Home */
.home-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.home-head p { margin: 8px 0 0; max-width: 60ch; }
.runs { display: grid; gap: 12px; }
.run-row { width: 100%; text-align: left; border: 0; cursor: pointer; font: inherit; color: inherit; display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.6fr) 150px; gap: 20px; align-items: center; padding: 18px 24px; color: inherit; }
.run-row:hover { text-decoration: none; box-shadow: 0 2px 10px var(--shadow); }
.run-row .name { font-weight: 600; color: var(--damson); font-size: 16px; }
.bar { height: 6px; background: var(--damson-100); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--stormy-teal); border-radius: 99px; }
.empty { text-align: center; padding: 56px 24px; }
.empty p { max-width: 46ch; margin: 8px auto 20px; }
.section-label { font-weight: 600; color: var(--damson-800); margin: 32px 0 12px; font-size: 14px; }

.back { background: none; border: 0; padding: 4px 0; color: var(--damson); cursor: pointer; font-weight: 500; }
.back:hover { text-decoration: underline; }
.confirm-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--bad-bg); color: var(--bad-text); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--damson); color: var(--soft-white); padding: 10px 18px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 16px var(--shadow); z-index: 10; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); }
.field textarea { min-height: 70px; resize: vertical; }
.overlay { position: fixed; inset: 0; background: rgba(53,9,68,.35); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; z-index: 20; }
.sheet { background: var(--soft-white); border-radius: 12px; width: 100%; max-width: 820px; box-shadow: 0 12px 40px rgba(53,9,68,.25); padding: 24px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.subject-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--sand); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
.subject-row .k { font-size: 12px; color: var(--damson-800); font-weight: 600; }
.subject-row .v { font-weight: 500; }
.email-body { background: #fff; color: #000; border: 1px solid var(--border-default); border-radius: 8px; padding: 20px 24px; max-height: 60vh; overflow-y: auto; }
.email-body mark, .tpl-preview mark { background: #FCEDD4; color: #8a5d0c; border-radius: 3px; padding: 0 3px; }
.missing-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.email-block { padding: 20px 0; border-bottom: 1px solid var(--border-muted); scroll-margin-top: 16px; }
.email-block:last-of-type { border-bottom: 0; }
.email-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.email-title h3 { font-size: 16px; }
.email-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.size-btn { padding: 3px 10px; min-width: 36px; font-weight: 600; border-color: var(--border-strong); }
.size-val { min-width: 38px; text-align: center; font-weight: 600; font-size: 13px; color: var(--damson); }
.email-block .email-body { max-height: none; }
.email-block.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--damson-50); } to { background: transparent; } }
@media print { .email-block .sheet-actions, .email-block .missing-bar, .email-block .btn { display: none !important; } }
.email-list { list-style: none; margin: 12px 0 0; padding: 0; }
.email-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-muted); }
.email-list li:last-child { border-bottom: 0; }
.linkish.email { color: var(--damson); font-weight: 600; }
.tpl-editor { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: start; }
.rte-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px; border: 1px solid var(--border-default); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--damson-50); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; }
.rte-btn { border: 1px solid transparent; background: transparent; color: var(--damson); border-radius: 6px; padding: 5px 10px; font-size: 14px; cursor: pointer; min-width: 34px; }
.rte-btn:hover { background: var(--damson-100); border-color: var(--damson-200); }
.rte-sep { width: 1px; height: 22px; background: var(--border-strong); margin: 0 4px; }
.rte-size { min-width: 40px; text-align: center; font-size: 13px; font-weight: 600; color: var(--damson); }
.rte-link { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--border-default); border-bottom: 0; background: var(--damson-50); }
.rte-link[hidden] { display: none; }
.rte-link input { flex: 1 1 200px; border: 1px solid var(--border-default); border-radius: 6px; padding: 7px 10px; background: var(--field); }
.rte-link select { width: auto; flex: 0 1 220px; }
.rte { min-height: 420px; max-height: 70vh; overflow-y: auto; border: 1px solid var(--border-default); border-radius: 0 0 8px 8px; padding: 14px 16px; background: #fff; color: #000; font-family: Aptos, Calibri, Arial, sans-serif; font-size: 11pt; line-height: 1.4; }
.rte:focus { outline: none; border-color: var(--damson); }
.rte a { color: #0563C1; }
.rte ul, .rte ol { margin: 0; padding-left: 24px; }
.ph-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ph-chip { border: 1px solid var(--damson-200); background: var(--damson-50); color: var(--damson); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.ph-chip:hover { background: var(--damson-100); }
.move-btn { font-size: 16px; padding: 6px 10px; border: 1px solid var(--border-default); }
.move-btn:disabled { opacity: .35; cursor: default; }
.auto-tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .02em; background: var(--stormy-teal); color: var(--on-accent); border-radius: 99px; padding: 0 6px; margin-left: 2px; vertical-align: 1px; }
.tpl-preview { position: sticky; top: 16px; }
select { width: 100%; border: 1px solid var(--border-default); border-radius: 8px; padding: 9px 12px; background: var(--field); color: var(--near-black); }
@media (max-width: 860px) { .tpl-editor { grid-template-columns: 1fr; } .tpl-preview { position: static; } .subject-row { grid-template-columns: 1fr; } }
.layout.single { grid-template-columns: minmax(0,1fr); }
.timeline { margin-bottom: 20px; }
.day-group { padding-top: 18px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border-muted); }
.day-head h2 { font-size: 15px; }
.day-head .when { font-size: 13px; color: var(--damson-800); }
.day-group.is-overdue .day-head h2, .day-group.is-overdue .day-head .when { color: var(--bad-fg); }
.day-group.is-overdue { background: var(--bad-bg); margin: 14px -24px 0; padding: 14px 24px 4px; }
.day-group.is-today .day-head h2::after { content: "Today"; margin-left: 8px; font-size: 11px; background: var(--damson); color: var(--soft-white); border-radius: 99px; padding: 2px 8px; vertical-align: 2px; }
.day-group.is-past .day-head h2 { color: var(--damson-600); }
.theme-tag { font-size: 12px; color: var(--damson-600); margin-top: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--damson-800); cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--damson); }
.add-row input[type=date] { flex: 0 0 auto; width: auto; }
@media print { .day-group.is-overdue { background: none; margin: 0; padding: 14px 0 4px; } }
.tabs { display: flex; gap: 4px; margin: 24px 0 0; border-bottom: 1px solid var(--border-default); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; font-size: 15px; font-weight: 500; color: var(--damson-600); cursor: pointer; margin-bottom: -1px; }
.tab:hover { color: var(--damson); }
.tab.active { color: var(--damson); border-bottom-color: var(--damson); }
.tabs + .layout { margin-top: 20px; }
.pax { margin-top: 20px; }
.pax-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pax-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 10px; }
.pax-summary .chip { font-size: 13px; padding: 4px 12px; }
.table-wrap { overflow-x: auto; }
.pax-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pax-table th { text-align: left; font-weight: 600; color: var(--damson-800); font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
.pax-table td { padding: 12px; border-bottom: 1px solid var(--border-muted); vertical-align: top; }
.pax-table tr.cancelled td { opacity: .55; }
.p-name { font-weight: 600; }
@media print { .tabs { display: none; } }
.draft-ok { margin: 12px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-fg); font-size: 14px; }
.draft-ok a { color: inherit; font-weight: 600; text-decoration: underline; }
/* Run header */
.run-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items: start; }
.countdown { text-align: right; }
.countdown .num { font-family: var(--serif); font-size: 44px; line-height: 1; color: var(--damson); }
.countdown .lbl { font-size: 13px; color: var(--damson-800); margin-top: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px 24px; margin: 20px 0 0; }
.facts dt { font-size: 12px; color: var(--damson-600); }
.facts dd { margin: 2px 0 0; font-weight: 500; }
.overall { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-muted); font-size: 14px; }
.overall .bar { flex: 1; height: 8px; }

/* Layout */
.layout { display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 28px; margin-top: 28px; align-items: start; }
.rail { position: sticky; top: 20px; }
.rail ol { list-style: none; margin: 0; padding: 0; position: relative; }
.rail ol::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: var(--border-default); }
.rail li { position: relative; }
.rail button { display: grid; grid-template-columns: 28px 1fr; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 8px 8px 0; cursor: pointer; border-radius: 8px; }
.rail button:hover .r-name { text-decoration: underline; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--linen); border: 2px solid var(--border-strong); color: var(--damson-600); position: relative; z-index: 1; }
.is-done .dot { background: var(--stormy-teal); border-color: var(--stormy-teal); color: var(--on-accent); }
.is-current .dot { background: var(--damson); border-color: var(--damson); color: var(--on-accent); box-shadow: 0 0 0 4px var(--damson-100); }
.r-name { font-weight: 600; color: var(--damson); font-size: 14px; line-height: 1.3; }
.is-done .r-name { color: var(--damson-800); }
.r-meta { font-size: 12px; color: var(--damson-600); }
.is-current .r-meta { color: var(--damson); font-weight: 500; }

/* Stages */
.stage { margin-bottom: 20px; scroll-margin-top: 16px; }
.stage-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border-muted); }
.stage-head .when { font-size: 13px; color: var(--damson-800); }
.stage.is-current { box-shadow: 0 0 0 2px var(--damson), 0 1px 3px var(--shadow); }
.tag-current { display: inline-block; background: var(--damson); color: var(--soft-white); font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; margin-left: 10px; vertical-align: 2px; }
.stage-note { background: var(--sand); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; }
.tasks { list-style: none; margin: 0; padding: 0; }
.task { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border-muted); align-items: start; }
.task:last-child { border-bottom: 0; }
.task input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 1px 0 0; border: 2px solid var(--border-strong); border-radius: 6px; background: var(--soft-white); cursor: pointer; display: grid; place-items: center; }
.task input[type=checkbox]:hover { border-color: var(--damson); }
.task input[type=checkbox]:checked { background: var(--stormy-teal); border-color: var(--stormy-teal); }
.task input[type=checkbox]:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
.task label { cursor: pointer; font-weight: 500; }
.task.done label { color: var(--damson-600); text-decoration: line-through; text-decoration-color: var(--damson-400); }
.hint { font-size: 13px; color: var(--damson-800); margin-top: 2px; }
.task-tools { display: flex; gap: 4px; margin-top: 4px; }
.linkish { background: none; border: 0; padding: 0; color: var(--damson-600); font-size: 12px; cursor: pointer; }
.linkish:hover { color: var(--damson); text-decoration: underline; }
.note-input { width: 100%; margin-top: 8px; border: 1px solid var(--border-default); border-radius: 6px; padding: 7px 10px; font-size: 13px; background: var(--field); }
.note-input:focus { border-color: var(--damson); outline: none; }
.chip { white-space: nowrap; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 3px 10px; background: var(--damson-100); color: var(--damson); }
.chip-done { background: var(--ok-bg); color: var(--ok-fg); }
.chip-overdue { background: var(--bad-bg); color: var(--bad-fg); }
.chip-soon { background: var(--warn-bg); color: var(--warn-fg); }
.chip-missing { background: transparent; color: var(--damson-600); font-weight: 500; padding: 3px 0; white-space: normal; text-align: right; max-width: 170px; }
.add-row { display: flex; gap: 8px; margin-top: 14px; }
.add-row input { flex: 1; border: 1px dashed var(--border-strong); border-radius: 8px; padding: 8px 12px; background: transparent; font-size: 14px; }
.add-row input:focus { border-style: solid; border-color: var(--damson); outline: none; background: var(--field); }
.notes-area { width: 100%; min-height: 110px; border: 1px solid var(--border-default); border-radius: 8px; padding: 12px; background: var(--field); resize: vertical; margin-top: 12px; }

/* Form */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px 20px; margin-top: 20px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--damson); margin-bottom: 6px; }

"", "received": false, "status": "Scheduled to Attend"}]}, "qaZoom": "joanne", "qaZoomMeetingId": "", "qaZoomPasscode": "", "qaZoomUrl": "", "runCode": "EC-009182", "sfEventId": "a00DEMO0000000001A", "sfEventName": "CONFIRMED NPSA CMP IN-PERSON | November 17 - 19, 2026", "startDate": "2026-11-17", "tasks": {"d1": {"done": false, "doneAt": null, "doneBy": null}, "e4": {"done": true, "doneAt": "2026-10-27", "doneBy": "u_demo_coordinator_1"}, "p1": {"done": true, "doneAt": "2026-10-15", "doneBy": "u_demo_coordinator_1"}, "p2": {"done": true, "doneAt": "2026-10-15", "doneBy": "u_demo_coordinator_2"}, "p3": {"done": true, "doneAt": "2026-10-27", "doneBy": "u_demo_coordinator_1"}, "w1": {"done": true, "doneAt": "2026-10-27", "doneBy": "u_demo_coordinator_1"}}, "updatedAt": "2026-10-27T10:23:19.058Z", "updatedBy": "u_demo_coordinator_1", "venue": "Harbourview Grand Hotel", "venueAddress": "12 Example Avenue  Singapore 000000"}], "openId": null, "templates": [{"body": "Hi all,\n\nAhead of the training program in 4 weeks’ time, we would need your help to complete the following:\n\n- [Dietary Requirements Survey Form]({{dietaryFormLink}}) – To let us know if you have/do not have any dietary restrictions for the hotel vendor to take note of for their catered food menu by **{{dietaryDeadline}}**. (Pls complete the form even if you do not have any dietary restrictions.)\n- [Individual End User Declaration Clause Acknowledgement Form]({{declarationFormLink}}) – To read through the Individual End User Declaration Clause on the Survey Form and submit this form to acknowledge it by **{{declarationDeadline}}**.\n\nPls fill up and complete the mandatory survey forms (links embedded above) by the respective deadlines indicated above.\n\nAlso, pls find the class details below for your reference:\n\n**Date:** {{classDates}}\n**Timing:** {{timing}} on all {{dayCount}} days\n\n**Training Venue:**\n{{venue}}\n{{venueAddress}}\n\n**Meeting Room:**\n{{meetingRoom}}\n\nThank you and we look forward to seeing you soon! 😊\n\nTraining & Delivery Team\nBrightpath\n[training@brightpath.example](mailto:training@brightpath.example)\n[www.brightpath.example](https://www.brightpath.example)", "builtIn": true, "id": "tpl-dietary-declaration", "name": "Dietary requirements and declaration form", "subject": "Brightpath Change Management Certification Program {{programmeDates}} - Dietary Requirements and Individual End User Declaration Clause Acknowledgement Form", "taskId": "e4", "updatedAt": "2026-10-15T08:05:29.639Z"}, {"body": "Hi everyone, please take a few seconds to answer this survey so that we can take note of any dietary requirements (if applicable). Please submit your responses by {{dietaryDeadline}} so that we have ample time to make the arrangements, thank you for your kind attention.\n\nWe would also like to share some details for the upcoming program you're registered for.\nDate:\n{{programmeDates}}\nTime:\n{{timing}}\nVenue:\n{{venue}}\n{{venueAddress}}\nMeeting Room:\n{{meetingRoom}}", "html": "\u003cdiv>Hi everyone, please take a few seconds to answer this survey so that we can take note of any dietary requirements (if applicable). Please submit your responses by {{dietaryDeadline}} so that we have ample time to make the arrangements, thank you for your kind attention.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cu>We would also like to share some details for the upcoming program you're registered for.\u003c/u>\u003c/div>\u003cdiv>Date:\u003c/div>\u003cdiv>{{programmeDates}}\u003c/div>\u003cdiv>Time:\u003c/div>\u003cdiv>{{timing}}\u003c/div>\u003cdiv>Venue:\u003c/div>\u003cdiv>{{venue}}\u003c/div>\u003cdiv>{{venueAddress}}\u003c/div>\u003cdiv>Meeting Room:\u003c/div>\u003cdiv>{{meetingRoom}}\u003c/div>", "id": "tpl-form-description", "name": "Declaration form description", "subject": "", "taskId": "e1", "updatedAt": "2026-10-26T14:52:18.582Z"}, {"body": "", "html": "\u003cdiv>\u003cb>\u003cspan style=\"font-size: 20pt;\">Brightpath Change Management Certification Program – Northwind Public Service Academy on {{programmeDates}}\u003c/span>\u003c/b>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Dear all,\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 11pt;\">Before the program commences, there are some important details and preparations we would like to share with you.\u003c/span>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cb>\u003cu>\u003cspan style=\"font-size: 14pt;\">Pre-Program Requirements\u003c/span>\u003c/u>\u003c/b>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 11pt;\">To enhance your in-program learning experience, please complete the prework tasks provided through the Brightpath Portal by {{preworkDeadline}}.&nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Prework Prior to the Program:\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cul>\u003cli>&nbsp;You will receive access details via email before the program start date. Allocate approximately two hours for completion, ensuring it's submitted before the program begins for instructor review.\u003c/li>\u003cli>For assistance in selecting a suitable project, consult \u003cb>Task 2A: Select a Project &amp; Project Selection – Frequently Asked Questions in the Brightpath Portal \u003c/b>under Task 2 of the Prework.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003cul>\u003cli>Please complete the prework by {{preworkDeadline}} to help our instructors understand a little more about you, your role, and your project. We ask that where possible, you base your prework on a real-life project* that is currently underway or being planned in your organisation.\u003c/li>\u003c/ul>\u003cspan style=\"font-size: 11pt;\">\u003cbr>\u003c/span>\u003cspan style=\"font-size: 11pt;\">Additionally, please review The 5 Principles of Change and the Northstar Case Study, both can be found in the prework before the program.&nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>*For the uninitiated, a project is defined as an initiative launched to create unique output(s) (such as a product/service) to achieve specific objectives. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>A project has a clear start and end in time, defined scope and resources. Typically, a project is commissioned by a sponsor (e.g. a senior executive) to realize certain outcomes and benefits that contribute to the organization's strategy/mission/vision.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cb>\u003cu>\u003cspan style=\"font-size: 14pt;\">Training Materials\u003c/span>\u003c/u>\u003c/b>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Your training materials including writing stationery will be provided on site.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cb>\u003cu>\u003cspan style=\"font-size: 14pt;\">Program Details\u003c/span>\u003c/u>\u003c/b>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Training Venue: \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>{{venue}}\u003c/div>\u003cdiv>{{venueAddress}}\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Meeting Room:\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>{{meetingRoom}}\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 14pt; font-weight: bold;\">Schedule Times:\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">Day 1 - 3\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cbr>\u003c/div>\u003cdiv>\u003cb>\u003cspan style=\"font-size: 12pt;\">{{timing}}\u003c/span>\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cdiv>On Day 2 and Day 3, the instructors will be reviewing the knowledge checks 15 minutes before program commencement and to address any issues or remaining questions. The last hour of the program on Day 3 will remain for open discussion with the instructor(s) regarding the presentation delivered on the day and any remaining questions.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Your instructor will factor in breaks and lunch around the flow of training each day.\u003c/div>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cb>\u003cbr>\u003c/b>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 12pt;\">\u003cb>IT requirements &amp; preparation:&nbsp;\u003c/b>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 12pt;\">\u003cb>\u003cbr>\u003c/b>\u003c/span>\u003c/div>\u003cul>\u003cli>\u003cdiv>You’ll need a laptop with a strong internet connection and access to Brightpath’s Solution Suite. Please refrain from using tablets or highly secured company computers unless you can proficiently type/work and access everything you need for the program on these devices (e.g. public Wi-Fi and the Brightpath Portal).\u003c/div>\u003c/li>\u003cli style=\"font-size: 11.5pt;\">You will need access to Microsoft Office 2007 or newer. If you plan to use a Mac product, please use Microsoft Office for Mac to ensure tool compatibility.\u003c/li>\u003cli style=\"font-size: 11.5pt;\">Please ensure that your laptop has an HDMI/USB-C port for presentation purposes.\u003c/li>\u003c/ul>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Lastly, we’d like to reiterate that Brightpath Learning has a duty of care to uphold Brightpath certification standards. Please take heed of the vital information below.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 12pt;\">\u003cu>\u003cb>Attendance and Certification\u003c/b>\u003c/u>\u003c/span>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 10pt;\">100% program attendance is required for certification. If you anticipate needing time away from the program, kindly inform us before it commences, and we will assist in rescheduling. Please note you could be subject to our Terms and Conditions.\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 10pt;\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 10pt;\">This is a highly participative and intensive program and it will require the full commitment of your time and concentration. You will NOT be awarded the ‘Brightpath Certified Practitioner’ digital credentials if any training is missed. Please avoid scheduling any meetings/calls during the duration of the program.\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 10pt;\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"font-size: 10pt;\">All participants need to complete and return the prework document by the given deadline in order to be allowed on the Brightpath program.&nbsp;Successful program completion involves passing daily knowledge checks and delivering a presentation on your chosen project.\u003c/span>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cdiv style=\"font-size: 11.5pt;\">Thank you for choosing Brightpath for your professional development journey. We look forward to a successful and enlightening certification program.\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cb>If you have any questions about preparing for your program, please do not hesitate to contact us at \u003c/b>\u003ca href=\"mailto:training@brightpath.example\">\u003cb>training@brightpath.example\u003c/b>\u003c/a>\u003cb>.\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cb>Best Regards,\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cb>Brightpath Training &amp; Delivery Team\u003c/b>\u003c/div>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>", "id": "tpl-mv98lytg", "name": "Brightpath Change Management Certification Program Welcome Email", "subject": "Brightpath Change Management Certification Program – Northwind Public Service Academy on {{programmeDates}}", "taskId": "r4", "updatedAt": "2026-10-15T09:43:43.875Z"}, {"body": "", "html": "\u003cdiv style=\"font-size: 12pt;\">\u003cb>Brightpath Change Management Certification Program – Northwind Public Service Academy on {{startDate}} - {{endDate}}\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cb>\u003cbr>\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">Dear all,\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">Hope you are well!\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">We understand the amount of preparation required for the upcoming change management program might be overwhelming, but we want to reassure you that the pre-work is meant to help you get ready for the program.\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">To support you further, we will be scheduling an \u003cb>optional\u003c/b>&nbsp;Zoom call on \u003cb>{{qaDate}}\u003c/b> from \u003cb>{{qaTime}} (SGT)\u003c/b> for people to ask questions regarding the preparations and/or about the program itself. Please join us using the Zoom link below.\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cspan style=\"font-size: 12pt;\">*As this email does not serve as a calendar invite, please do block this Q&amp;A date and timing on your calendar.\u003c/span>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cb>\u003cbr>\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cb>Zoom Invitation &amp; Timings\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 11.5pt;\">\u003cdiv style=\"font-size: 12pt;\">\u003cb>Topic: Brightpath Practitioner Certification Pre-program Q&amp;A\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cb>{{qaZoomDetails}}\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cb>\u003cbr>\u003c/b>\u003c/div>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">Note: We will close the session after 10 minutes if we do not see anyone joining.\u003c/div>\u003cdiv style=\"font-size: 12pt;\">Thank you and see you virtually soon!\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cdiv style=\"font-size: 12pt;\">\u003cb>Training &amp; Delivery Team\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cb>Brightpath\u003c/b>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003ca href=\"mailto:training@brightpath.example\">\u003cb>training@brightpath.example\u003c/b>\u003c/a>\u003c/div>\u003cdiv style=\"font-size: 12pt;\">\u003ca href=\"https://www.brightpath.example\">\u003cb>www.brightpath.example\u003c/b>\u003c/a>\u003c/div>\u003c/div>", "id": "tpl-mv9bvq4f", "name": "Q & A", "subject": "Q&A session (optional) | Change Management Certification", "taskId": "w3", "updatedAt": "2026-10-15T09:44:07.281Z"}], "zoom": {"links": [{"host": "Priya", "id": "priya", "meetingId": "900 1000 2000", "passcode": "", "url": "https://zoom.example/j/90010002000?pwd=demo"}, {"host": "Marcus", "id": "marcus", "meetingId": "907 2111 2913", "passcode": "112345", "url": "https://zoom.example/j/90721112913?pwd=demo"}, {"host": "Siti", "id": "siti", "meetingId": "914 3222 3826", "passcode": "124690", "url": "https://zoom.example/j/91432223826?pwd=demo"}, {"host": "Kevin", "id": "kevin", "meetingId": "921 4333 4739", "note": "Alex & Jordan can also host", "passcode": "137035", "url": "https://zoom.example/j/92143334739?pwd=demo"}, {"host": "Joanne", "id": "joanne", "meetingId": "928 5444 5652", "passcode": "149380", "url": "https://zoom.example/j/92854445652?pwd=demo"}, {"host": "Elaine", "id": "elaine", "meetingId": "935 6555 6565", "passcode": "161725", "url": "https://zoom.example/j/93565556565?pwd=demo"}, {"host": "Wendy Lim", "id": "wendy", "meetingId": "942 7666 7478", "passcode": "174070", "url": "https://zoom.example/j/94276667478?pwd=demo"}], "source": "Demo data"}, "settings": {"templateOrder": [" const NPSA_TIMING = '9:00am to 6:00pm';
const QA_TIME = '6:00pm to 6:30pm';
const DECLARATION_FORM_LINK = 'https://forms.example.com/r/demo-declaration';   // standard declaration form, used unless a run sets its own
function dietaryDeadline(r) { return off(r.startDate, -14); }              // 2 weeks before program
function preworkDeadline(r) {                                               // 5 working days (Mon-Fri) before program
  if (!r.startDate) return null; let d = r.startDate, n = 0;
  while (n < 5) { d = off(d, -1); const w = parse(d).getUTCDay(); if (w !== 0 && w !== 6) n++; }
  return d;
}
function qaDate(r) {                                                        // Wednesday of the week before the program
  if (!r.startDate) return null; const w = parse(r.startDate).getUTCDay();
  return off(off(r.startDate, -((w + 6) % 7)), -5);
}
function monthName(s) { return parse(s).toLocaleDateString('en-GB', { month: 'long', timeZone: 'UTC' }); }
function dmy(s) { return s ? parse(s).getUTCDate() + ' ' + monthName(s) + ' ' + parse(s).getUTCFullYear() : ''; }
function longDate(s) { return s ? parse(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : ''; }
function programmeDatesText(r) {
  if (!r.startDate) return '';
  const a = r.startDate, b = r.endDate && r.endDate > a ? r.endDate : a;
  if (a === b) return dmy(a);
  const A = parse(a), B = parse(b);
  if (A.getUTCFullYear() !== B.getUTCFullYear()) return dmy(a) + ' \u2013 ' + dmy(b);
  if (A.getUTCMonth() !== B.getUTCMonth()) return A.getUTCDate() + ' ' + monthName(a) + ' \u2013 ' + dmy(b);
  return A.getUTCDate() + '\u2013' + dmy(b);
}
function classDatesText(r) {
  const d = programmeDays(r); if (!d.length) return '';
  if (d.length === 1) return dmy(d[0]);
  const sameMonth = d.every(x => x.slice(0, 7) === d[0].slice(0, 7));
  if (!sameMonth || d.length > 6) return programmeDatesText(r);
  const nums = d.map(x => parse(x).getUTCDate());
  return nums.slice(0, -1).join(', ') + ' & ' + nums[nums.length - 1] + ' ' + monthName(d[0]) + ' ' + parse(d[0]).getUTCFullYear();
}

/* ---------- Formatted (rich) template bodies ----------
   Templates are stored as simple HTML with {{placeholders}}. Older templates
   written in the plain **bold** / [link](url) style are converted on the fly. */
const RICH_TAGS = { B: 'b', STRONG: 'b', I: 'i', EM: 'i', U: 'u', SPAN: 'span', FONT: 'span', A: 'a', P: 'div', DIV: 'div', BR: 'br', UL: 'ul', OL: 'ol', LI: 'li', H1: 'div', H2: 'div', H3: 'div', H4: 'div' };
const DROP_TAGS = /^(SCRIPT|STYLE|META|TITLE|HEAD|LINK|IFRAME|OBJECT|EMBED|SVG|IMG|VIDEO|AUDIO|TEMPLATE|NOSCRIPT)$/i;
const HEADING_SIZE = { H1: '16pt', H2: '14pt', H3: '12pt', H4: '11pt' };
const FONT_SIZE = { 1: '8pt', 2: '10pt', 3: '12pt', 4: '14pt', 5: '18pt', 6: '24pt', 7: '36pt' };
function markupToHtml(body) {
  const inline = l => esc(l).replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, t, u) => '<a href="' + u + '">' + t + '</a>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let out = '', inList = false;
  String(body || '').split('\n').forEach(l => {
    if (/^- /.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(l.slice(2)) + '</li>'; return; }
    if (inList) { out += '</ul>'; inList = false; }
    out += l.trim() ? '<div>' + inline(l) + '</div>' : '<div><br></div>';
  });
  if (inList) out += '</ul>';
  return out;
}
function toPt(v) {
  const n = parseFloat(v); if (!n) return '';
  if (/px$/.test(v)) return (Math.round(n * 0.75 * 2) / 2) + 'pt';
  if (/pt$/.test(v)) return (Math.round(n * 2) / 2) + 'pt';
  return '';
}
function sanitizeRich(html) {
  const src = new DOMParser().parseFromString('<body>' + String(html || '') + '</body>', 'text/html').body;
  const out = document.createElement('div');
  const walk = (node, parent) => {
    Array.from(node.childNodes).forEach(n => {
      if (n.nodeType === 3) { parent.appendChild(document.createTextNode(n.nodeValue.replace(/[\r\n]+/g, ' '))); return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toUpperCase();
      if (DROP_TAGS.test(tag)) return;
      const to = RICH_TAGS[tag];
      if (!to) { walk(n, parent); return; }
      const el = document.createElement(to);
      if (to === 'a') { const h = (n.getAttribute('href') || '').trim(); if (/^(https?:|mailto:|\{\{)/i.test(h)) el.setAttribute('href', h); }
      if (to !== 'br') {
        const st = n.style || {};
        const fs = toPt(st.fontSize || '') || HEADING_SIZE[tag] || (tag === 'FONT' ? FONT_SIZE[n.getAttribute('size')] : '');
        if (fs) el.style.fontSize = fs;
        if (/bold|^[6-9]00$/.test(st.fontWeight || '') || /^H\d$/.test(tag)) el.style.fontWeight = 'bold';
        if (st.fontStyle === 'italic') el.style.fontStyle = 'italic';

function orderedTemplates() {

  return (state.templates || []).slice().sort((a, b) => rank(a) - rank(b));
}
function moveTemplate(id, dir) {

/* ============================ Participants (Salesforce) ============================
   Read through the viewer's Salesforce connector (mcp capability, tool soqlQuery).
   The last result is saved on the run (run.pax) so everyone sees the same list. */
const SF_SERVER = 'Salesforce';
const NPSA_ACCOUNT_ID = '001DEMO000000000AA';   // demo account
let mcpNs = null, paxBusy = false, paxError = null;
async function getMcp() {
  return null; // demo copy: no live Salesforce/Outlook
  if (!(window.claude && typeof window.claude.use === 'function')) return null;
  try { mcpNs = await window.claude.use('mcp'); } catch (e) { mcpNs = null; }
  return mcpNs;
}
const sfId = v => /^[A-Za-z0-9]{15,18}$/.test(v || '') ? v : null;
const sfDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : null;
async function sfQuery(q) {
  const mcp = await getMcp();
  if (!mcp) { const e = new Error('unavailable'); e.code = 'unavailable_here'; throw e; }
  const run1 = () => mcp.callTool(SF_SERVER, 'soqlQuery', { q });
  let res;
  try { res = await run1(); }
  catch (e) {
    if (e && e.retryable) { await new Promise(r => setTimeout(r, Math.max(e.retryAfterMs || 0, 600 + Math.random() * 900))); res = await run1(); }
    else throw e;
  }
  let p = res && res.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) {} }
  if (!p || !Array.isArray(p.records)) { const e = new Error('Salesforce sent back something unexpected.'); e.code = 'bad_shape'; throw e; }
  return p.records;
}
function paxErrorText(e) {
  const c = e && e.code;
  if (c === 'unavailable_here') return 'This is a demo copy with sample data, so it doesn\u2019t connect to Salesforce.';
  if (c === 'server_not_connected') return 'Salesforce isn\u2019t connected to your Claude account. Add it in claude.ai Settings \u2192 Connectors, then try again.';
  if (c === 'needs_reauth') return 'Your Salesforce connection has expired. Reconnect Salesforce in claude.ai Settings \u2192 Connectors, then try again.';
  if (c === 'selection_required') return 'You have more than one Salesforce connection. Choose which one this tracker should use when Claude asks, then try again.';
  if (c === 'not_in_manifest' || c === 'approval_required') return 'This tracker isn\u2019t allowed to use Salesforce for you yet. Allow it when Claude asks, or turn it on in this artifact\u2019s Permissions menu.';
  if (c === 'blocked_by_policy') return 'Your organization\u2019s settings block this tracker from using Salesforce.';
  if (c === 'server_unavailable' || c === 'rate_limited') return 'Salesforce didn\u2019t respond. Wait a minute and try again.';
  if (c === 'no_event') return e.message;
  if (c === 'tool_error') return 'Salesforce returned an error: ' + (e.message || 'unknown error') + '.';
  return 'Couldn\u2019t load from Salesforce' + (e && e.message ? ': ' + e.message : '.');
}
async function refreshParticipants(run) {
  if (paxBusy) return;
  paxBusy = true; paxError = null; softRenderNow();
  try {
    let eventId = sfId(run.sfEventId);
    if (!eventId) {
      const start = sfDate(run.startDate);
      if (!start) { const e = new Error('Add the program start date first, so the tracker can find the Salesforce Training Event.'); e.code = 'no_event'; throw e; }
      const evs = await sfQuery("SELECT Id, Name FROM Training_Event__c WHERE Start_Date__c = " + start +
        " AND (End_User_Company__c = '" + NPSA_ACCOUNT_ID + "' OR Name LIKE '%NPSA%' OR Name LIKE '%Northwind%') ORDER BY CreatedDate DESC LIMIT 2");
      if (evs.length !== 1) {
        const e = new Error(evs.length ? 'More than one NPSA Training Event starts on ' + fmt(start, true) + '. Paste the right Salesforce Training Event ID under Edit details.' : 'No NPSA Training Event in Salesforce starts on ' + fmt(start, true) + '. Check the start date, or paste the Salesforce Training Event ID under Edit details.');
        e.code = 'no_event'; throw e;
      }
      eventId = sfId(evs[0].Id); run.sfEventId = eventId; run.sfEventName = evs[0].Name || '';
    }
    const recs = await sfQuery("SELECT Id, Full_Name__c, ATC_Email__c, Status__c, prework_task_status__c, Pre_work_received__c, Project_Title__c, LastModifiedDate FROM Associated_Training_Contacts__c WHERE Training_Event__c = '" + eventId + "' ORDER BY Full_Name__c");
    const people = recs.map(r => ({
      id: String(r.Id || ''),
      name: new DOMParser().parseFromString(String(r.Full_Name__c || ''), 'text/html').body.textContent.trim(),
      email: String(r.ATC_Email__c || ''),
      status: String(r.Status__c || ''),
      prework: String(r.prework_task_status__c || 'Not Started'),
      received: !!r.Pre_work_received__c,
      project: String(r.Project_Title__c || ''),
      modified: String(r.LastModifiedDate || '').slice(0, 10)
    }));
    run.pax = { at: new Date().toISOString(), by: me || null, people };
    persistRun(run, { sfEventId: eventId, sfEventName: run.sfEventName || '', pax: run.pax });
    toast('Loaded ' + people.length + ' participant' + (people.length === 1 ? '' : 's') + ' from Salesforce');
  } catch (e) { paxError = paxErrorText(e); }
  paxBusy = false; softRenderNow();
  return !paxError;
}

const OUTLOOK_TAGS = { P: 'p', DIV: 'div', BR: 'br', A: 'a', B: 'b', STRONG: 'b', I: 'i', EM: 'i', UL: 'ul', OL: 'ol', LI: 'li', STRIKE: 'strike', H1: 'h1', H2: 'h2', H3: 'h3' };
function outlookSafeHtml(html) {
  const src = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html').body;
  const out = document.createElement('div');
  const walk = (node, parent) => Array.from(node.childNodes).forEach(n => {
    if (n.nodeType === 3) { parent.appendChild(document.createTextNode(n.nodeValue)); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toUpperCase();
    let to = OUTLOOK_TAGS[tag];
    if (tag === 'SPAN' && parseFloat(n.style.fontSize) >= 14) to = 'b';           // large text: keep it bold
    if (tag === 'SPAN' && /bold|^[6-9]00$/.test(n.style.fontWeight || '')) to = 'b';
    if (!to) { walk(n, parent); return; }                                          // u, span, mark, font: keep the text
    const el = document.createElement(to);
    if (to === 'a') { const h = (n.getAttribute('href') || '').trim(); if (/^(https?:|mailto:)/i.test(h)) el.setAttribute('href', h); else { walk(n, parent); return; } }
    walk(n, el); parent.appendChild(el);
  });
  walk(src, out);
  return out.innerHTML;
}
function draftErrorText(e) {
  const c = e && e.code;
  if (c === 'unavailable_here') return 'Outlook drafts can only be created when this tracker is open in Claude.';
  if (c === 'server_not_connected') return 'Microsoft 365 isn\u2019t connected to your Claude account. Add it in claude.ai Settings \u2192 Connectors, then try again.';
  if (c === 'needs_reauth') return 'Your Microsoft 365 connection has expired. Reconnect it in claude.ai Settings \u2192 Connectors, then try again.';
  if (c === 'selection_required') return 'You have more than one Microsoft 365 connection. Choose which one this tracker should use when Claude asks, then try again.';
  if (c === 'not_in_manifest' || c === 'approval_required') return 'This tracker isn\u2019t allowed to create Outlook drafts for you yet. Allow it when Claude asks, or turn it on in this artifact\u2019s Permissions menu.';
  if (c === 'blocked_by_policy') return 'Your organization\u2019s settings block this tracker from creating Outlook drafts.';
  if (c === 'tool_error') return 'Outlook didn\u2019t accept the draft: ' + (e.message || 'unknown error') + '.';
  return 'The draft may or may not have been created. Check your Outlook Drafts before trying again.';
}
async function createDraft(run, tplId) {
  const ds = draftState[tplId] || (draftState[tplId] = {});
  if (ds.busy) return;
  const tpl = (state.templates || []).find(t => t.id === tplId); if (!tpl) return;
  const f = fillTemplate(tpl, run);
  if (f.missing.length) { Object.assign(ds, { err: 'Fill in the missing details first: ' + f.missing.join(', ') + '.', msg: null, link: null }); softRenderNow(); return; }
  Object.assign(ds, { busy: true, err: null, msg: null, link: null }); softRenderNow();
  let note = '';
  const fresh = await refreshParticipants(run);
  if (!fresh) {
    if (run.pax && Array.isArray(run.pax.people)) note = ' Salesforce couldn\u2019t be reached, so this used the participant list saved ' + new Date(run.pax.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + '.';
    else { Object.assign(ds, { busy: false, err: paxError || 'Couldn\u2019t load the participant list from Salesforce.' }); softRenderNow(); return; }
  }
  const emails = [...new Set(run.pax.people.filter(p => p.status === 'Scheduled to Attend' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)).map(p => p.email.trim()))];
  if (!emails.length) { Object.assign(ds, { busy: false, err: 'No one on the Salesforce list is \u201cScheduled to Attend\u201d, so there\u2019s no one to Bcc.' }); softRenderNow(); return; }
  if (emails.length > 50) { Object.assign(ds, { busy: false, err: 'Outlook drafts allow up to 50 recipients, and this run has ' + emails.length + '. Use Copy email instead.' }); softRenderNow(); return; }
  try {
    const mcp = await getMcp();
    if (!mcp) { const e = new Error('unavailable'); e.code = 'unavailable_here'; throw e; }
    const res = await mcp.callTool(M365_SERVER, 'outlook_create_draft', { subject: f.subject || tpl.name, body: outlookSafeHtml(f.html), bodyType: 'html', bcc: emails });
    const pl = res && res.payload;
    const link = typeof pl === 'string' ? ((pl.match(/webLink:\s*(https:\/\/\S+)/) || [])[1] || null) : (pl && typeof pl.webLink === 'string' && /^https:\/\//.test(pl.webLink) ? pl.webLink : null);
    Object.assign(ds, { busy: false, link, msg: 'Draft saved in your Outlook Drafts with ' + emails.length + ' participant' + (emails.length === 1 ? '' : 's') + ' in Bcc. Review it and send from Outlook.' + note });
  } catch (e) { Object.assign(ds, { busy: false, err: draftErrorText(e) }); }
  softRenderNow();
}

function rteCurrentPt() {

  const a = b.dataset.action; const run = currentRun();
  if (a === 'home') { go('home'); return; }
  if (a === 'new') { go('new'); return; }
  if (a === 'open') { go('run', b.dataset.id); return; }

  if (a === 'restore') { document.getElementById('restore-input').click(); return; }
  if (a === 'templates') { go('templates'); return; }
  if (a && a.startsWith('fmt-')) {
    const ed = rteEditor(); if (!ed) return;
    const sel = rteSelectionInside();
    if (a === 'fmt-link-cancel') { document.getElementById('rte-link').hidden = true; rteRange = null; return; }
    if (a === 'fmt-link-apply') {
      const url = document.getElementById('rte-link-url').value.trim();
      if (!/^(https?:\/\/|mailto:|\{\{)/i.test(url)) { toast('Use a full web address starting with https://, or pick a form link.'); return; }
      ed.focus(); const s2 = window.getSelection(); if (rteRange) { s2.removeAllRanges(); s2.addRange(rteRange); }
      document.execCommand('createLink', false, url);
      document.getElementById('rte-link').hidden = true; rteRange = null; renderTplPreview(); return;
    }
    if (!sel) { ed.focus(); toast('Click in the email body first.'); return; }
    const collapsed = sel.getRangeAt(0).collapsed;
    if (a === 'fmt-bold') document.execCommand('bold');
    if (a === 'fmt-italic') document.execCommand('italic');
    if (a === 'fmt-underline') document.execCommand('underline');
    if (a === 'fmt-list') document.execCommand('insertUnorderedList');
    if (a === 'fmt-clear') { document.execCommand('removeFormat'); document.execCommand('unlink'); }
    if (a === 'fmt-bigger' || a === 'fmt-smaller') {
      if (collapsed) { toast('Select the words you want to resize first.'); return; }
      const cur = rteCurrentPt();
      const next = a === 'fmt-bigger' ? RTE_SIZES.find(n => n > cur) : RTE_SIZES.slice().reverse().find(n => n < cur);
      if (!next) { toast(a === 'fmt-bigger' ? 'That\u2019s the largest size.' : 'That\u2019s the smallest size.'); return; }
      rteApplySize(next);
    }
    if (a === 'fmt-link') {
      if (collapsed) { toast('Select the words you want to turn into a link first.'); return; }
      rteRange = sel.getRangeAt(0).cloneRange();
      const box = document.getElementById('rte-link'); box.hidden = false;
      const inp = document.getElementById('rte-link-url'); inp.value = ''; document.getElementById('rte-link-pick').value = ''; inp.focus();
      return;
    }
    rteUpdateSize(); renderTplPreview(); return;
  }
  if (a === 'tpl-up' || a === 'tpl-down') { moveTemplate(b.dataset.id, a === 'tpl-up' ? -1 : 1); return; }
  if (a === 'tpl-new') { ui.editTpl = 'new'; render(); window.scrollTo(0, 0); return; }
  if (a === 'tpl-edit') { ui.editTpl = b.dataset.id; render(); window.scrollTo(0, 0); return; }
  if (a === 'tpl-cancel') { ui.editTpl = null; render(); return; }
  if (a === 'tpl-delete') { ui.confirmTpl = b.dataset.id; render(); return; }
  if (a === 'tpl-delete-yes') { removeTemplate(b.dataset.id); ui.confirmTpl = null; render(); toast('Template deleted'); return; }
  if (a === 'tpl-reset') {
    const d = DEFAULT_TEMPLATES.find(x => x.id === b.dataset.id); if (!d) return;
    document.getElementById('tpl-subject').value = d.subject; rteEditor().innerHTML = templateHtml(d);
    document.getElementById('tpl-name').value = d.name;
    renderTplPreview(); toast('Original wording restored. Save to keep it.'); return;
  }
  if (a === 'insert-ph') {
    const el = lastTplField || rteEditor(); if (!el) return;
    const ins = '{{' + b.dataset.key + '}}';
    if (el.isContentEditable) {
      if (!rteSelectionInside()) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s3 = window.getSelection(); s3.removeAllRanges(); s3.addRange(r); }
      document.execCommand('insertText', false, ins); renderTplPreview(); return;
    }
    const st = el.selectionStart ?? el.value.length, en = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, st) + ins + el.value.slice(en); el.focus(); el.setSelectionRange(st + ins.length, st + ins.length);
    renderTplPreview(); return;
  }
  if (a === 'tpl-save') {
    const name = document.getElementById('tpl-name').value.trim();
    if (!name) { toast('Give the template a name.'); document.getElementById('tpl-name').focus(); return; }
    const data = { name, taskId: document.getElementById('tpl-task').value, subject: document.getElementById('tpl-subject').value, html: sanitizeRich(rteEditor().innerHTML), body: '', updatedAt: new Date().toISOString() };
    { const tmp = document.createElement('div'); tmp.innerHTML = data.html; data.body = htmlToText(tmp); }
    let tpl;
    if (ui.editTpl === 'new') { tpl = Object.assign({ id: 'tpl-' + Date.now().toString(36) }, data); state.templates.push(tpl); }
    else { tpl = state.templates.find(t => t.id === ui.editTpl); Object.assign(tpl, data); }
    persistTemplate(tpl); ui.editTpl = null; render(); toast('Template saved'); return;
  }
  if (!run) return;
  if (a === 'preview') {
    const el = document.getElementById('email-' + b.dataset.tpl);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    return;
  }
  if (a === 'make-draft') { createDraft(run, b.dataset.tpl); return; }
  if (a === 'copy-email' || a === 'copy-subject') {
    const tpl = state.templates.find(t => t.id === b.dataset.tpl); if (!tpl) return;
    const f = fillTemplate(tpl, run);
    (a === 'copy-email' ? copyRich(f.html, f.text) : copyPlain(f.subject)).then(ok => toast(ok
      ? (a === 'copy-email' ? 'Email copied. Paste it into Outlook.' + (f.missing.length ? ' Some details are still missing.' : '') : 'Subject copied')
      : 'Copying is blocked here. Open the file in Chrome or Edge, or select the text and copy it.'));
    return;
  }
  if (a === 'mark-sent') {
    const st = { done: true, doneAt: today(), doneBy: me || null };
    run.tasks = run.tasks || {}; run.tasks[b.dataset.id] = Object.assign(run.tasks[b.dataset.id] || {}, st);
    persistRun(run, { tasks: { [b.dataset.id]: st } }); const y = window.scrollY; render(); window.scrollTo(0, y); toast('Marked as sent'); return;
  }
  if (a === 'edit') { ui.preview = null; ui.editing = true; render(); window.scrollTo(0, 0); }
  if (a === 'tab') { ui.tab = b.dataset.tab; paxError = null; softRenderNow(); if (ui.tab === 'pax' && !run.pax && !readOnly) refreshParticipants(run); return; }
  if (a === 'pax-refresh') { refreshParticipants(run); return; }
  if (a === 'pax-copy') {
    const list = ((run.pax && run.pax.people) || []).filter(p => p.status !== 'Cancelled' && p.prework !== 'Complete' && p.email).map(p => p.email).join('; ');
    copyPlain(list).then(ok => toast(ok ? 'Emails copied. Paste them into the To or Bcc line.' : 'Copying is blocked here. Select the emails in the table instead.'));
    return;
  }
  if (a === 'print') { try { window.print(); } catch (err) { toast('Printing is blocked here. Open the file in Chrome or Edge to print.'); } }
  if (a === 'export-run') download('NPSA-' + slug(run.name) + '.html', standaloneHTML([run], run.id), 'text/html');
  if (a === 'delete') { ui.confirmDelete = true; render(); try { window.scrollTo(0, 0); } catch (e) {} }
  if (a === 'delete-no') { ui.confirmDelete = false; render(); }
  if (a === 'delete-yes') { const name = run.name; removeRun(run.id); go('home'); toast('Deleted ' + name); }
  if (a === 'goto') { const el = document.getElementById('stage-' + b.dataset.stage); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  if (a === 'note') { ui.openNotes[b.dataset.id] = true; render(); const el = app.querySelector('[data-note="' + CSS.escape(b.dataset.id) + '"]'); if (el) el.focus(); }
  if (a === 'add-task') { addTask(b.dataset.stage); return; }
  if (a === 'remove-task') {
    const stage = b.dataset.stage, cid = b.dataset.id;
    run.custom = run.custom || {}; run.custom[stage] = run.custom[stage] || {}; run.custom[stage][cid] = null;
    if (run.tasks) run.tasks[cid] = null;
    persistRun(run, { custom: { [stage]: { [cid]: null } }, tasks: { [cid]: null } }); render();
  }
});

app.addEventListener('change', e => {
  if (e.target.dataset.action === 'hide-done') { setHideDone(e.target.checked); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const id = e.target.dataset.task; if (!id) return;
  const run = currentRun(); if (!run) return;
  run.tasks = run.tasks || {};
  const t = run.tasks[id] || {};
  t.done = e.target.checked; t.doneAt = t.done ? today() : null; t.doneBy = t.done ? (me || null) : null;
  run.tasks[id] = t; persistRun(run, { tasks: { [id]: { done: t.done, doneAt: t.doneAt, doneBy: t.doneBy } } });
  const y = window.scrollY; render(); window.scrollTo(0, y);
});

app.addEventListener('input', e => {
  const run = currentRun(); if (!run) return;
  if (readOnly) return;
  if (e.target.dataset.note) {
    const id = e.target.dataset.note;
    run.tasks = run.tasks || {};
    const t = run.tasks[id] || {}; t.note = e.target.value; run.tasks[id] = t;
    notePatch.tasks = notePatch.tasks || {}; notePatch.tasks[id] = { note: t.note };
  } else if ('runnotes' in e.target.dataset) { run.notes = e.target.value; notePatch.notes = run.notes; }
  else return;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { const p = notePatch; notePatch = {}; persistRun(run, p); }, 600);
});

function saveRunForm() {
  const box = document.getElementById('run-form'); if (!box) return;
  const data = {};
  box.querySelectorAll('input[name], textarea[name], select[name]').forEach(i => { data[i.name] = i.value.trim(); });
  if (!data.name) { toast('Add a run name to continue.'); box.querySelector('[name=name]').focus(); return; }
  if (!data.startDate) { toast('Add the program start date to continue.'); box.querySelector('[name=startDate]').focus(); return; }
  if (data.endDate && data.endDate < data.startDate) { toast('The end date is before the start date. Check the program dates.'); return; }
  let run = currentRun();
  if (run && ui.editing) { Object.assign(run, data); persistRun(run, data); }
  else { run = Object.assign({ id: uid(), tasks: {}, custom: {}, notes: '', createdAt: new Date().toISOString(), createdBy: me || null }, data); state.runs.push(run); persistRun(run); }
  go('run', run.id); toast('Saved');
}
function addTask(stage) {
  const run = currentRun(); const box = app.querySelector('[data-add="' + stage + '"]'); if (!run || !box) return;
  const text = box.querySelector('[name=text]').value.trim(); if (!text) return;
  const dueEl = box.querySelector('[name=due]');
  const cid = 'c-' + Date.now().toString(36), item = { text, at: Date.now() };
  if (dueEl && dueEl.value) item.due = dueEl.value;
  run.custom = run.custom || {}; run.custom[stage] = run.custom[stage] || {}; run.custom[stage][cid] = item;
  persistRun(run, { custom: { [stage]: { [cid]: item } } }); const y = window.scrollY; render(); window.scrollTo(0, y);
  const again = app.querySelector('[data-add="' + stage + '"] [name=text]'); if (again) again.focus();
}
app.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.preview) { ui.preview = null; render(); return; }
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  if (e.target.closest('#run-form')) { e.preventDefault(); saveRunForm(); }
  const add = e.target.closest('[data-add]'); if (add) { e.preventDefault(); addTask(add.dataset.add); }
});

document.getElementById('restore-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let data;
      if (/\.html?$/i.test(file.name)) {
        const doc = new DOMParser().parseFromString(reader.result, 'text/html');
        data = JSON.parse(doc.getElementById('seed').textContent);
      } else { data = JSON.parse(reader.result); }
      const runs = data && data.runs;
      if (!Array.isArray(runs)) throw new Error();
      mergeTemplates(data.templates);
      const n = mergeRuns(runs);
      toast(n ? n + ' run' + (n === 1 ? '' : 's') + ' imported or updated.' : 'Nothing new to import. Your copies are already up to date.');
      render();
    } catch (err) { toast('That file isn’t a NPSA tracker backup. Choose a .json backup or a run file saved from this tracker.'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});
document.getElementById('restore-input').setAttribute('accept', '.json,.html,application/json,text/html');

window.addEventListener('hashchange', () => {
  const r = routeFromHash(location.hash);
  if (r.view !== route.view || r.id !== route.id) { route = r; ui = { editing: false, openNotes: {}, confirmDelete: false, preview: null, editTpl: null }; render(); }
});

/* ============================ Start ============================ */
load();
try { route = routeFromHash(location.hash); } catch (e) {}
try {
  const seed = JSON.parse(document.getElementById('seed').textContent);
  if (seed && Array.isArray(seed.runs) && !connecting) {
    mergeRuns(seed.runs);
    mergeTemplates(seed.templates);
    if (seed.zoom) state.zoom = seed.zoom;
    if (seed.settings) state.settings = Object.assign({}, seed.settings, state.settings || {});
    if (seed.openId && !location.hash) route = { view: 'run', id: seed.openId };
  }
} catch (e) {}
render();
connect();
</script>
</body>
</html>
